
name: TRON Automatic Contract Scanner

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

concurrency:
  group: tron-contract-scanner
  cancel-in-progress: false

jobs:
  scan:
    name: Scan verified TRON contracts
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Check scanner configuration
        env:
          SCAN_URL: ${{ secrets.VERCEL_SCAN_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SCAN_URL" ]; then
            echo "Missing VERCEL_SCAN_URL secret"
            exit 1
          fi

          if [ -z "$CRON_SECRET" ]; then
            echo "Missing CRON_SECRET secret"
            exit 1
          fi

      - name: Trigger scanner
        env:
          SCAN_URL: ${{ secrets.VERCEL_SCAN_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body \
            --silent \
            --show-error \
            --retry 2 \
            --retry-delay 5 \
            --max-time 120 \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Accept: application/json" \
            "${SCAN_URL}"
